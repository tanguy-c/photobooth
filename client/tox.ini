[tox]
skipsdist = true
envlist = tests,pep8,pre-commit

[testenv:tests]
deps =
    pytest
    pytest-django
    pytest-cov
    responses
    Django
    celery
    exif
    Pillow
    qrcode
    requests
commands = pytest --cov=photobooth --cov-report=term-missing {posargs}

[testenv:pep8]
commands = flake8
deps =
    flake8

[testenv:pre-commit]
deps =
    pre-commit
commands =
    pre-commit run --all-files

[flake8]
# E501: line too long.
extend-ignore=E501
exclude = migrations,.tox,.venv
