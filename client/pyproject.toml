[project]
name = "photobooth"
version = "1.0.0"
description = "Photobooth application."
authors = [
    { name = "Clement Cavanier", email = "clement.cavanier@bleemeo.com" },
    { name = "Lionel Porcheron", email = "lionel.porcheron@bleemeo.com" },
    { name = "Pierre Fersing", email = "pierre.fersing@bleemeo.com" },
]
requires-python = "==3.12.*"
readme = "README.md"

dependencies = [
    "Django",
    "celery",
    "exif",
    "Pillow",
    "psycopg",
    "qrcode",
    "requests",
]

[dependency-groups]
dev = [
    "autopep8",
    "flake8",
    "tox",
    "pytest",
    "pytest-django",
    "pytest-cov",
    "responses",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "photobooth.settings.development"
pythonpath = ["."]

[tool.uv]
package = false
